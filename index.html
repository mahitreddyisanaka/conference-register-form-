<!DOCTYPE html>
<html>
<head>
    <title>Conference Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Conference Registration Form</h1>
    <p>Please fill in the details to register for the conference.</p>

    <form>

        <h3>Personal Details</h3>

        <label>Full Name:</label><br>
        <input type="text" name="name" placeholder="Enter your name" required>
        <br><br>

        <label>Email:</label><br>
        <input type="email" name="email" placeholder="Enter your email" required>
        <br><br>

        <label>Phone Number:</label><br>
        <input type="tel" name="phone" pattern="[0-9]{10}"
               placeholder="10 digit phone number" required>
        <br><br>

        <label>College / Organization:</label><br>
        <input type="text" name="college">
        <br><br>

        <label>Gender:</label><br>
        <input type="radio" name="gender" value="Male"> Male
        <input type="radio" name="gender" value="Female"> Female
        <input type="radio" name="gender" value="Other"> Other
        <br><br>

        <h3>Conference Details</h3>

        <label>Conference Topic:</label><br>
        <select name="topic" required>
            <option value="">Select a topic</option>
            <option>Technology</option>
            <option>Artificial Intelligence</option>
            <option>Business</option>
            <option>Science</option>
        </select>
        <br><br>

        <label>Conference Date:</label><br>
        <input type="date" name="date" required>
        <br><br>

        <label>Number of Participants:</label><br>
        <input type="number" name="participants" min="1" max="5" required>
        <br><br>

        <label>Mode of Attendance:</label><br>
        <input type="radio" name="mode" value="Online"> Online
        <input type="radio" name="mode" value="Offline"> Offline
        <br><br>

        <h3>Choose Sessions</h3>

        <input type="checkbox" name="session" value="Workshop">
        Workshop
        <br>

        <input type="checkbox" name="session" value="Guest Lecture">
        Guest Lecture
        <br>

        <input type="checkbox" name="session" value="Discussion">
        Group Discussion
        <br>

        <input type="checkbox" name="session" value="Networking">
        Networking
        <br><br>

        <label>Additional Comments:</label><br>
        <textarea name="comments" rows="4" cols="35"
                  placeholder="Enter your comments"></textarea>
        <br><br>

        <input type="checkbox" name="terms" required>
        I agree to the terms and conditions.
        <br><br>

        <input type="submit" value="Submit">
        <input type="reset" value="Reset">

    </form>

</body>
</html>
